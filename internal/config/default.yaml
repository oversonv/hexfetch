# hexfetch default configuration (embedded into the binary).
# Mirrors the built-in defaults of `fastfetch --config none`.
# Personal settings go to $HOME/hex/set/hexfetch.yaml and are layered on top of this file.
# Create that file with: hexfetch --gen-config
hexfetch:
  # Logo name, "auto" (pick from /etc/os-release) or "none". List names with: hexfetch --list-logos
  logo: nixos_average
  # Colors of the nixos_average logo only; other logos use their own flat colors.
  # 12 colors: start and end color of each of the 6 gradient bands (the vanilla colors below).
  # 2 colors: one start and one end color shared by all bands. 1 color: a flat logo.
  # Remove the list to use the vanilla colors.
  logo_colors:
    - "38;2;133;104;242"
    - "38;2;206;177;240"
    - "38;2;107;106;255"
    - "38;2;79;185;254"
    - "38;2;206;177;240"
    - "38;2;133;104;242"
    - "38;2;79;185;254"
    - "38;2;107;106;255"
    - "38;2;206;177;240"
    - "38;2;133;104;242"
    - "38;2;107;106;255"
    - "38;2;79;185;254"
  display:
    separator: ": "
    separator_char: "-"
    color:
      keys: "1;35"
      title: "1;34"
      output: ""
      separator: ""
  modules:
    # Same order as fastfetch's default structure (fastfetch "disk" is "disks" here).
    items:
      - title
      - separator
      - os
      - host
      - kernel
      - uptime
      - packages
      - shell
      - display
      - de
      - wm
      - wmtheme
      - theme
      - icons
      - font
      - cursor
      - terminal
      - terminalfont
      - cpu
      - gpu
      - memory
      - swap
      - disks
      - localip
      - battery
      - poweradapter
      - locale
      - break
      - colors
